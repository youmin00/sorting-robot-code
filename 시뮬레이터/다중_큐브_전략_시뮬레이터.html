<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4큐브 피킹 전략 예비 시뮬레이터</title>
<style>:root{color-scheme:dark;--bg:#0a1020;--panel:#151d32;--line:#2a3654;--blue:#49b9ff;--green:#4fdd91;--yellow:#ffca55;--red:#ff6974}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eaf0fb;font:14px system-ui,"Malgun Gothic",sans-serif}header{padding:18px 22px;border-bottom:1px solid var(--line)}h1{margin:0 0 5px;font-size:21px}.sub,.muted{color:#9eabc5}.layout{display:grid;grid-template-columns:340px 1fr;gap:14px;padding:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.control{margin-bottom:14px}.control label{display:block;margin-bottom:6px}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}button,select,input{width:100%;border:1px solid #354361;border-radius:7px;background:#0d1528;color:white;padding:9px}button{cursor:pointer;background:#273654}button.primary{background:#167cb9}button.green{background:#12855a}button:hover{filter:brightness(1.12)}canvas{display:block;width:100%;height:600px;background:#0c1426;border-radius:9px}.status{margin-top:10px;padding:10px;background:#0d1528;border-radius:8px;line-height:1.55}.ok{color:var(--green)}.bad{color:var(--red)}table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px}th,td{padding:7px;border-bottom:1px solid #293550;text-align:right}th:first-child,td:first-child{text-align:left}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.card{background:#0d1528;border:1px solid #2b3957;border-radius:8px;padding:8px;font-size:12px}.selected{border-color:var(--yellow);box-shadow:0 0 0 1px var(--yellow)}.removed{opacity:.38}.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;color:#aab6ce}.dot:before{content:"";display:inline-block;width:10px;height:10px;background:var(--c);margin-right:5px;border-radius:2px}@media(max-width:900px){.layout{grid-template-columns:1fr}canvas{height:480px}.cards{grid-template-columns:1fr 1fr}}</style></head>
<body><header><h1>4큐브 피킹 전략 예비 시뮬레이터</h1><div class="sub">작업영역 X -120~+120 mm · 담당 Y 0~+105 mm · 필요할 때만 최대 10° 기울기 · 기울기별 예압 보정 · 회수 시 J1 마지막</div></header>
<main class="layout"><aside class="panel">
<div class="control"><label>큐브 선정 기준</label><select id="policy"><option value="nearest">① 가장 가까운 큐브</option><option value="reachable">② 수직 집기 가능한 큐브 중 가장 가까운 큐브</option><option value="leastBlocked" selected>③ 도달 가능하며 직선 통로 방해물이 가장 적은 큐브</option><option value="corridor">④ 집기 가능 + 로봇 방향 직선 통로가 열린 큐브</option></select></div>
<div class="row control"><label>상판 위 접근 높이<input id="approach" type="number" min="0" max="60" step="1" value="10"></label><label>집은 뒤 총상승 높이<input id="lift" type="number" min="0" max="80" step="1" value="16"></label></div>
<div class="row control"><button class="primary" id="randomBtn">4개 랜덤 배치</button><button class="green" id="stepBtn">다음 1개 피킹</button><button id="autoBtn">전부 자동 피킹</button><button id="batchBtn">100회 전략 비교</button></div>
<div class="status" id="status">랜덤 배치를 생성합니다.</div><div class="cards" id="cards"></div>
<table><thead><tr><th>전략</th><th>완료</th><th>집기 성공</th><th>실패</th></tr></thead><tbody id="results"><tr><td colspan="4">100회 테스트 전</td></tr></tbody></table>
<div class="muted" style="margin-top:12px;line-height:1.5">③번은 완전한 경로계획이 아니라, 로봇 중심에서 목표 큐브까지의 직선 통로에 다른 큐브가 겹치는지만 검사하는 간단한 비교용 로직입니다.</div>
</aside><section class="panel"><canvas id="view"></canvas><div class="legend"><span class="dot" style="--c:#48b8ff">3 cm</span><span class="dot" style="--c:#ffca55">5 cm</span><span class="dot" style="--c:#4fdd91">선택</span><span class="dot" style="--c:#ff6974">통로 방해</span></div></section></main>
<script>
const C={x0:104.5,x1:215,y0:-120,y1:120,L1:130,L2:130,L3:76,H2:51.3,toolLeftOffset:12,margin:3,gap:0,tol:3,cameraOriginX:209.5};
const RECOVERY={preloadBase:2,preloadExtraPerDegree:.2,preloadMax:5,pickMaxTilt:15,recoveryMaxTilt:45,bellowsMax:8,totalLift:16,mode:'MINIMUM_TILT_J1_FIRST_PICK_J1_LAST_RETURN',sequence:['loading','j1-aim','arm-approach','contact','tilt-preload','vacuum-contract','robot-lift','arm-retract','j1-last'],loading:{J1:90,J2:120,J3:56,J4:0}};let cubes=[],selected=null,log=[];
const $=id=>document.getElementById(id),rad=d=>d*Math.PI/180;
function cameraToRobot(xMm,yMm,zMm,size){return{x:C.cameraOriginX-yMm,y:xMm,top:zMm>0?zMm:size}}
function setCameraObjects(objects){cubes=objects.slice(0,4).map((o,i)=>{const z=Number(o.robot_z_mm??0),size=Math.abs(z-50)<Math.abs(z-30)?50:30,p=cameraToRobot(Number(o.robot_x_mm??0),Number(o.robot_y_mm??0),z,size);return{id:Number(o.id??i+1),size,angle:Number(o.angle_deg??0),x:p.x,y:p.y,removed:false}});selected=null;log=[];message(`카메라 좌표 ${cubes.length}개를 Robot 좌표로 변환했습니다.`,true);draw()}
window.setCameraObjects=setCameraObjects;
const workspace=[];for(let j2=0;j2<=180;j2+=0.5)for(let j3=0;j3<=90;j3+=0.5){const a2=j2-60-j3;workspace.push([130*Math.cos(rad(j2))+130*Math.cos(rad(a2)),51.3+130*Math.sin(rad(j2))+130*Math.sin(rad(a2)),j2,j3,0,a2])}
function ik(x,y,z,comp,maxTilt=0){const targetRadius=Math.hypot(x,y);if(targetRadius<C.toolLeftOffset)return{err:1e9};const r=Math.sqrt(targetRadius*targetRadius-C.toolLeftOffset*C.toolLeftOffset),tilts=[0];for(let a=.5;a<=maxTilt;a+=.5)tilts.push(a,-a);let best={err:1e9};for(const tilt of tilts){let local={err:1e9};for(const p of workspace){const a2=p[5],j4=tilt-a2;if(j4<0||j4>180)continue;const a3=-90+tilt,L=76-comp,rr=p[0]+L*Math.cos(rad(a3)),zz=p[1]+L*Math.sin(rad(a3)),e=Math.hypot(rr-r,zz-z),v={err:e,j2:p[2],j3:p[3],j4,tilt};if(e<local.err)local=v;if(e<best.err)best=v}if(local.err<=C.tol)return local}return best}
function stages(c){const a=+$('approach').value,l=+$('lift').value,contact=ik(c.x,c.y,c.size,0,RECOVERY.pickMaxTilt);let comp=RECOVERY.preloadBase,preload=ik(c.x,c.y,c.size,comp,RECOVERY.pickMaxTilt);for(let i=0;i<2;i++){const next=Math.min(RECOVERY.preloadMax,RECOVERY.preloadBase+Math.abs(preload.tilt||0)*RECOVERY.preloadExtraPerDegree);if(Math.abs(next-comp)<.01)break;comp=next;preload=ik(c.x,c.y,c.size,comp,RECOVERY.pickMaxTilt)}preload.comp=comp;return{approach:ik(c.x,c.y,c.size+a,0,RECOVERY.pickMaxTilt),contact,preload,lift:ik(c.x,c.y,c.size+l,RECOVERY.bellowsMax,RECOVERY.recoveryMaxTilt)}}
function reach(c){const s=stages(c),area=region(c),bad=Object.entries(s).filter(([,v])=>v.err>C.tol);if(!area.ok)bad.unshift(['area',{err:Infinity,text:area.reason}]);return{ok:!bad.length,bad,s,area}}
function axes(c){const a=c.angle*Math.PI/180,co=Math.cos(a),si=Math.sin(a);return[[co,si],[-si,co]]}
function overlap(a,b,gap=C.gap){const aa=axes(a),bb=axes(b),d=[b.x-a.x,b.y-a.y];for(const u of [...aa,...bb]){const center=Math.abs(d[0]*u[0]+d[1]*u[1]),ra=a.size/2*(Math.abs(aa[0][0]*u[0]+aa[0][1]*u[1])+Math.abs(aa[1][0]*u[0]+aa[1][1]*u[1])),rb=b.size/2*(Math.abs(bb[0][0]*u[0]+bb[0][1]*u[1])+Math.abs(bb[1][0]*u[0]+bb[1][1]*u[1]));if(center>=ra+rb+gap)return false}return true}
function cubeExtent(c){const a=c.angle*Math.PI/180;return c.size/2*(Math.abs(Math.cos(a))+Math.abs(Math.sin(a)))}
function region(c){const beltX=c.y,beltY=C.cameraOriginX-c.x,e=cubeExtent(c),outerY=C.cameraOriginX-C.x0;if(beltY<0)return{ok:false,reason:'중심 Y<0 · 반대편 로봇 담당'};if(beltY+e>outerY)return{ok:false,reason:'+Y 실제 경계 밖으로 큐브가 나감'};if(beltX-e<C.y0||beltX+e>C.y1)return{ok:false,reason:'X 실제 경계 밖으로 큐브가 나감'};const preferred=beltY+e<outerY-C.margin&&beltX-e>C.y0+C.margin&&beltX+e<C.y1-C.margin;return{ok:true,reason:preferred?'물리 경계 내부':'물리 경계 내부 · 3 mm 여유선 근접 · 피킹 허용'}}
function randomLayout(){const sizes=[30,30,50,50],out=[];for(let id=0;id<4;id++){const size=sizes[id];let placed=false;for(let n=0;n<2000;n++){const angle=Math.random()*90,a=angle*Math.PI/180,e=size/2*(Math.abs(Math.cos(a))+Math.abs(Math.sin(a))),beltX=C.y0+e+C.margin+Math.random()*(C.y1-C.y0-2*e-2*C.margin),beltY=Math.random()*(C.cameraOriginX-C.x0-e-C.margin),c={id:id+1,size,angle,x:C.cameraOriginX-beltY,y:beltX,removed:false};if(!out.some(o=>overlap(c,o))){out.push(c);placed=true;break}}if(!placed)return randomLayout()}cubes=out;selected=null;log=[];message('Y=0 쪽만 걸침을 허용하고 나머지 3개 경계 안에 4개 큐브를 배치했습니다.',true);draw()}
function pointSegDist(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,t=Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/(dx*dx+dy*dy)));return Math.hypot(px-(x1+t*dx),py-(y1+t*dy))}
function blockers(target,active=cubes.filter(c=>!c.removed)){return active.filter(o=>o.id!==target.id&&pointSegDist(o.x,o.y,0,0,target.x,target.y)<Math.SQRT2*(o.size+target.size)/2)}
function choose(policyName=$('policy').value,items=cubes){const active=items.filter(c=>!c.removed).sort((a,b)=>Math.hypot(a.x,a.y)-Math.hypot(b.x,b.y));if(policyName==='nearest')return active[0]||null;if(policyName==='reachable')return active.find(c=>reach(c).ok)||active[0]||null;if(policyName==='leastBlocked'){const reachable=active.filter(c=>reach(c).ok);return reachable.sort((a,b)=>blockers(a,active).length-blockers(b,active).length||Math.hypot(a.x,a.y)-Math.hypot(b.x,b.y))[0]||active[0]||null}return active.find(c=>reach(c).ok&&!blockers(c,active).length)||active.find(c=>reach(c).ok)||active[0]||null}
function failureText(r){return r.bad.map(([n,v])=>n==='area'?v.text:`${n} 오차 ${v.err.toFixed(1)} mm`).join(', ')}
function pickOne(){const c=choose();if(!c)return message('모든 큐브 피킹이 끝났습니다.',true);selected=c.id;const r=reach(c),bs=blockers(c),lift=+$('lift').value;if(!r.ok){log.push(`#${c.id} 실패: ${failureText(r)}`);message(`큐브 #${c.id} 집기 실패 · ${failureText(r)}`,false);draw();return false}if($('policy').value==='corridor'&&bs.length){log.push(`#${c.id} 통로 방해: ${bs.map(x=>'#'+x.id).join(',')}`);message(`큐브 #${c.id}의 직선 통로를 ${bs.map(x=>'#'+x.id).join(', ')} 큐브가 막습니다.`,false);draw();return false}const comp=r.s.preload.comp,passive=RECOVERY.bellowsMax-comp;c.removed=true;log.push(`#${c.id} (${c.size/10} cm) 성공 · 최소 기울기 · 회수 J1 마지막`);message(`큐브 #${c.id} 피킹 성공 · 최대 집기 기울기 ${Math.max(Math.abs(r.s.approach.tilt),Math.abs(r.s.contact.tilt),Math.abs(r.s.preload.tilt)).toFixed(1)}° → 예압 ${comp.toFixed(1)} mm → 공압 수축 ${passive.toFixed(1)} mm → 총상승 ${lift} mm → J1 마지막`,true);draw();return true}
async function autoPick(){for(let i=0;i<4;i++){if(!pickOne())break;await new Promise(r=>setTimeout(r,250))}}
function simulate(policyName,layout){const a=layout.map(c=>({...c,removed:false}));let success=0,reason={reach:0,corridor:0};for(let k=0;k<4;k++){const c=choose(policyName,a);if(!c)break;const r=reach(c),bs=blockers(c,a.filter(x=>!x.removed));if(!r.ok){reason.reach++;break}if(policyName==='corridor'&&bs.length){reason.corridor++;break}c.removed=true;success++}return{complete:success===4,success,reason}}
function batch(){const policies=['nearest','reachable','leastBlocked','corridor'],sum=Object.fromEntries(policies.map(p=>[p,{complete:0,picks:0,fail:0,reach:0,corridor:0}]));const saved=cubes.map(c=>({...c}));for(let n=0;n<100;n++){randomLayout();const layout=cubes.map(c=>({...c}));for(const p of policies){const r=simulate(p,layout),s=sum[p];s.complete+=r.complete;s.picks+=r.success;s.fail+=r.complete?0:1;s.reach+=r.reason.reach;s.corridor+=r.reason.corridor}}cubes=saved;const names={nearest:'가까운 순서',reachable:'도달 가능 우선',leastBlocked:'방해물 최소 우선',corridor:'직선 통로 우선'};$('results').innerHTML=policies.map(p=>`<tr><td>${names[p]}</td><td>${sum[p].complete}%</td><td>${sum[p].picks}/400</td><td>${sum[p].fail}<br><span class="muted">도달 ${sum[p].reach}, 통로 ${sum[p].corridor}</span></td></tr>`).join('');message('각 전략을 동일한 랜덤 배치 100개로 비교했습니다.',true);draw()}
function message(t,ok){$('status').innerHTML=`<span class="${ok?'ok':'bad'}">${t}</span>`+(log.length?'<br>'+log.slice(-4).join('<br>'):'')}
function draw(){const c=$('view'),d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*d;c.height=h*d;const g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,w,h);const pad=55,s=Math.min((w-2*pad)/(C.x1+80),(h-2*pad)/(C.y1-C.y0)),map=(x,y)=>[pad+(x+40)*s,h/2-y*s];g.strokeStyle='#263450';g.lineWidth=1;for(let y=C.y0;y<=C.y1;y+=30){let a=map(-40,y),b=map(250,y);g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke()}let a=map(C.x0,C.y1),b=map(C.x1,C.y0);g.fillStyle='rgba(130,105,220,.24)';g.fillRect(a[0],a[1],b[0]-a[0],b[1]-a[1]);g.strokeStyle='#9578ee';g.strokeRect(a[0],a[1],b[0]-a[0],b[1]-a[1]);const o=map(0,0);g.fillStyle='#aab6ce';g.beginPath();g.arc(...o,12,0,7);g.fill();g.fillText('J2',o[0]-8,o[1]-18);const target=selected&&cubes.find(x=>x.id===selected);if(target){const q=map(target.x,target.y);g.strokeStyle='#4fdd91';g.lineWidth=3;g.beginPath();g.moveTo(...o);g.lineTo(...q);g.stroke();for(const x of blockers(target)){const z=map(x.x,x.y);g.strokeStyle='#ff6974';g.beginPath();g.arc(...z,x.size*.72*s,0,7);g.stroke()}}for(const x of cubes){if(x.removed)continue;const q=map(x.x,x.y),px=x.size*s;g.save();g.translate(q[0],q[1]);g.rotate(-x.angle*Math.PI/180);g.fillStyle=x.size===30?'#48b8ff':'#ffca55';g.strokeStyle=x.id===selected?'#4fdd91':'#f4f7ff';g.lineWidth=x.id===selected?4:1.5;g.fillRect(-px/2,-px/2,px,px);g.strokeRect(-px/2,-px/2,px,px);g.fillStyle='#08101e';g.font='bold 12px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillText('#'+x.id,0,0);g.restore()}$('cards').innerHTML=cubes.map(x=>{const r=reach(x),camX=x.y,camY=C.cameraOriginX-x.x;return`<div class="card ${x.id===selected?'selected':''} ${x.removed?'removed':''}"><b>#${x.id} · ${x.size/10} cm</b><br>Camera code X ${camX.toFixed(1)} mm<br>Y ${camY.toFixed(1)} · Z ${x.size.toFixed(1)} mm<br>Robot X ${x.x.toFixed(1)} · Y ${x.y.toFixed(1)} mm<br><span class="${r.ok?'ok':'bad'}">${r.ok?'수직 집기 가능':'수직 집기 불가'}</span></div>`}).join('')}
$('randomBtn').onclick=randomLayout;$('stepBtn').onclick=pickOne;$('autoBtn').onclick=autoPick;$('batchBtn').onclick=batch;$('policy').onchange=draw;$('approach').oninput=draw;$('lift').oninput=draw;window.onresize=draw;randomLayout();
</script></body></html>
